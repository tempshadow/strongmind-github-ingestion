services:
  db:
    image: postgres:16-alpine
    container_name: strongmind_db
    environment:
      POSTGRES_USER: strongmind_ingestion
      POSTGRES_PASSWORD: password
      POSTGRES_DB: strongmind_ingestion_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strongmind_ingestion -d strongmind_ingestion_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: strongmind-github-ingestion:latest
    container_name: strongmind_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://strongmind_ingestion:password@db:5432/strongmind_ingestion_dev
      LOG_LEVEL: info
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: bundle exec rails server -b 0.0.0.0

  ingest-worker:
    image: strongmind-github-ingestion:latest
    container_name: strongmind_ingest_worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://strongmind_ingestion:password@db:5432/strongmind_ingestion_dev
      LOG_LEVEL: info
      GITHUB_EVENTS_URL: https://api.github.com/events
      POLL_INTERVAL_SECONDS: 60
      REQUEST_TIMEOUT_SECONDS: 10
    restart: on-failure:3
    command: bundle exec bin/ingest --loop

  ingest:
    image: strongmind-github-ingestion:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://strongmind_ingestion:password@db:5432/strongmind_ingestion_dev
      LOG_LEVEL: info
      GITHUB_EVENTS_URL: https://api.github.com/events
      REQUEST_TIMEOUT_SECONDS: 10
    profiles: ["manual"]
    command: bundle exec bin/ingest --once

  test:
    image: strongmind-github-ingestion:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://strongmind_ingestion:password@db:5432/strongmind_ingestion_test
      LOG_LEVEL: debug
    volumes:
      - .:/app
    profiles: ["manual"]
    command: bundle exec rspec

volumes:
  pgdata:
